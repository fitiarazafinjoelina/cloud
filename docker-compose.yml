services:
  cloud:
    image: cloud
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - cloud-network
    depends_on:
      - database

  database:
    image: postgres:15
    container_name: postgres_db
    restart: always
    ports:
      - "5433:5432"
    networks:
      - cloud-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: cloud
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
      - ./dockerUtilities/dump.sql:/docker-entrypoint-initdb.d/import.sql

volumes:
  postgres_data:

networks:
  cloud-network:  # Define the network
    name: cloud-network
    driver: bridge